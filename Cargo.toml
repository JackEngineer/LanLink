[workspace]
members = ["crates/agent", "crates/protocol", "crates/store", "crates/transport"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
snow = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
lanlink-protocol = { path = "crates/protocol" }
lanlink-store = { path = "crates/store" }
lanlink-transport = { path = "crates/transport" }
