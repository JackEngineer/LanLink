name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: runner.os == 'macOS'
        run: bash scripts/macos/package.sh ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: ./scripts/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LANLink-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
