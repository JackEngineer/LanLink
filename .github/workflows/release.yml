name: Build verified release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-version: ${{ steps.version.outputs.release-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: version
        name: Validate tag and source versions
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'deploy/release-sync')
          from sync import Version
          tag = os.environ['GITHUB_REF_NAME']
          version = Version.parse(tag)
          if not version or os.environ['GITHUB_REF'] != f'refs/tags/{tag}':
              raise SystemExit('Expected vX.Y.Z or vX.Y.Z-preview.N tag')
          versions = [json.loads(Path(p).read_text())['version']
                      for p in ('package.json', 'apps/web/package.json')]
          versions.append(tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version'])
          if any(source != version.base for source in versions):
              raise SystemExit('Tag base and source package versions disagree')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version.base}', file=output)
              print(f'release-version={version.tag[1:]}', file=output)
          PY
      - run: npm run site:check
      - run: python3 -B -m unittest discover -s deploy/release-sync
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'macOS'
        env:
          LANLINK_RELEASE_VERSION: ${{ needs.validate.outputs.release-version }}
        run: bash scripts/macos/package.sh ${{ matrix.target }}
      - if: runner.os == 'Windows'
        env:
          LANLINK_RELEASE_VERSION: ${{ needs.validate.outputs.release-version }}
        run: ./scripts/windows/package.ps1
      - name: Stage final packages only
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release
          cp "dist/LANLink-$VERSION-$TARGET.zip" release/
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            cp "dist/macos-$TARGET/LANLink-$VERSION-$TARGET.pkg" release/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Hash the exact four packages from this run
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('release')
          prefix = f"LANLink-{os.environ['VERSION']}"
          names = sorted([f'{prefix}-aarch64-apple-darwin.pkg',
                          f'{prefix}-aarch64-apple-darwin.zip',
                          f'{prefix}-x86_64-apple-darwin.zip',
                          f'{prefix}-x86_64-pc-windows-msvc.zip'])
          if sorted(p.name for p in root.iterdir()) != names:
              raise SystemExit('Release artifacts must contain exactly the four final packages')
          lines = []
          for name in names:
              path = root / name
              if path.is_symlink() or not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f'Invalid package: {name}')
              with path.open('rb') as package:
                  lines.append(f'{hashlib.file_digest(package, "sha256").hexdigest()}  {name}\n')
          (root / 'SHA256SUMS').write_text(''.join(lines), encoding='ascii')
          PY
      - id: attest
        name: Attest the manifest covering all package bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/SHA256SUMS
      - name: Include the verification bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          bundle = json.loads(Path(os.environ['ATTESTATION_BUNDLE']).read_text())
          Path('release/SHA256SUMS.sigstore.jsonl').write_text(json.dumps(bundle, separators=(',', ':')) + '\n')
          PY
      - name: Verify the attested release manifest
        run: |
          gh attestation verify release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --bundle release/SHA256SUMS.sigstore.jsonl \
            --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-set-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
