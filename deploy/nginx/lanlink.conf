# Replace example.com with the dedicated LANLink domain before enabling this site.
# This is an independent HTTP server block. Configure TLS before public launch.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/lanlink/current;
    index index.html;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/lanlink.access.log;
    error_log /var/log/nginx/lanlink.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|svg)$ {
        expires 5m;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
